name: DART 재무정보 수집

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '수집 한도 (기본 100)'
        required: false
        default: '100'

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests

      - name: DART 재무정보 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DAILY_LIMIT: ${{ github.event.inputs.limit }}
        run: python enrich_dart.py
