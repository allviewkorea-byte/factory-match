name: 블로그 허브 매일 갱신

on:
  schedule:
    # 한국시간 매일 오전 9시 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 수동 실행 허용

jobs:
  update-blog-hub:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # git push 권한

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 셋업
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: RSS 응답 진단 (임시)
        run: |
          echo "=== allviewkorea RSS 응답 진단 ==="
          curl -s -o blog/_rss_debug.xml -w "HTTP: %{http_code} | size: %{size_download} bytes\n" \
            -A "Mozilla/5.0" "https://rss.blog.naver.com/allviewkorea.xml" || true
          echo "--- 앞 600자 ---"
          head -c 600 blog/_rss_debug.xml || true
          echo ""

      - name: 네이버 블로그 RSS 수집 및 허브 생성
        run: |
          python fetch_blog_rss.py || echo "스크립트 비정상 종료(진단 계속)"

      - name: Git 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/ sitemap.xml 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "📭 변경사항 없음"
          else
            git commit -m "chore: 블로그 허브 갱신/진단 ($(date +'%Y-%m-%d'))"
            git push
            echo "✅ 완료"
          fi
